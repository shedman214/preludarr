# SPDX-License-Identifier: GPL-3.0-or-later
# Daily AnimeThemes canary: runs tools/animethemes_canary.py (Preludarr's own AnimeThemes code against
# the live GraphQL API) so a change or outage at AnimeThemes is noticed before users report it.
# On failure it opens one issue labelled "animethemes-canary" (or comments on the open one, so there
# are no duplicates); when the checks pass again it closes that issue. It only reads AnimeThemes and
# never touches releases, images or code. Run it by hand from the Actions tab at any time. Only runs on
# the default branch open or close the issue, so a manual run on another branch cannot hide an outage.
name: AnimeThemes canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animethemes-canary
  cancel-in-progress: false

jobs:
  canary:
    name: AnimeThemes canary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check AnimeThemes
        id: check
        continue-on-error: true
        # a hard deadline well inside the job timeout, so a stalled answer still gets reported
        run: timeout 300 python3 tools/animethemes_canary.py --report "$RUNNER_TEMP/canary.md"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/canary.md" ]; then cat "$RUNNER_TEMP/canary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Open or update the canary issue
        if: steps.check.outcome == 'failure' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          { cat "$RUNNER_TEMP/canary.md" 2>/dev/null || echo 'The canary did not produce a report.'
            printf '\nRun: %s\n' "$RUN_URL"; } > "$body"
          gh label create animethemes-canary --color D93F0B \
            --description 'Daily AnimeThemes check failed' 2>/dev/null || true
          number=$(gh issue list --label animethemes-canary --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --label animethemes-canary \
              --title 'AnimeThemes canary failed: AnimeThemes changed or is down' --body-file "$body"
          fi
          exit 1

      - name: Close the canary issue on recovery
        if: steps.check.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # a failed look-up fails this step (assignment keeps the exit status) instead of passing silently
          numbers=$(gh issue list --label animethemes-canary --state open --json number --jq '.[].number')
          for number in $numbers; do
            gh issue close "$number" --comment "Recovered: all AnimeThemes checks pass again ($RUN_URL)."
          done

      - name: Fail a branch run
        if: steps.check.outcome == 'failure' && github.ref_name != github.event.repository.default_branch
        run: exit 1
