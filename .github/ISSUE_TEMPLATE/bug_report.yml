name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post:** remove passwords, API keys, tokens, cookies, backup files and private paths or host names from everything below (logs, screenshots, settings). Security problems go through [SECURITY.md](https://github.com/shedman214/preludarr/security/policy), not here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, API keys, tokens, cookies and private paths from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: Preludarr version
      description: System → Releases (for example 1.12.0-beta.1)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where it runs
      options: [Unraid, Docker Compose, docker run, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …\n3. See …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines (optional, with secrets removed)
      description: Docker → Preludarr → Logs, or docker logs preludarr. Only the lines around the problem.
      render: text
